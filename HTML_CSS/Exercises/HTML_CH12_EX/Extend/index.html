<!DOCTYPE html>
<!-- Yehoshua Anton, 10/07/2026 -->
<html lang="en">

  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <title>
      NYC Highlights | Extend Your Knowledge 12
    </title>
  </head>

  <body>
    <!-- Bootstrap Jumbotron -->
    <header class="jumbotron jumbotron-fluid bg-light text-center mb-0">
      <div class="container">
        <h1 class="display-3">
          New York City Views
        </h1>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="container my-5">
      <div id="my-carousel" class="carousel slide mb-6" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#my-carousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#my-carousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#my-carousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
          </div>
          <div class="carousel-item active">
            <img src="./images/new-york-east.jpg" class="d-block w-100" alt="East New York">
          </div>

          <div class="carousel-item">
            <img src="./images/new-york-empire.jpg" class="d-block w-100" alt="Empire State Building">
          </div>

          <div class="carousel-item">
            <img src="./images/new-york-south.jpg" class="d-block w-100" alt="South New York">
          </div>
        </div>

        <button class="carousel-control-prev" type="button" data-bs-target="#my-carousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon bg-dark" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#my-carousel" data-bs-slide="next">
          <span class="carousel-control-next-icon bg-dark" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </main>

    <!-- Footer -->
    <footer class="jumbotron-fluid text-center bg-dark p-2">
      <div class="container text-white">
        <p>
          &copy; Copyright 2021. All Rights Reserved.
        </p>
        <p>
          Webpage Created by: Yehoshua Anton</p>
      </div>
    </footer>

    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js" integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
