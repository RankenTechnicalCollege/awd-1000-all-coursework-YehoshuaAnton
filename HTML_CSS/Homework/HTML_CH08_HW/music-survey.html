<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./music-styles.css">
  </head>

  <body>
    <form action="#" method="get">
      <label for="name">Name:</label>
      <input type="text" name="name" id="name">

      <label for="email">E-mail:</label>
      <input type="email" name="email" id="email">

      <fieldset>
        <legend>
          Select your favorite music genre
        </legend>

        <input type="radio" name="genre" id="rock">
        <label for="rock">Rock</label>

        <input type="radio" name="genre" id="pop">
        <label for="pop">Pop</label>

        <input type="radio" name="genre" id="hiphop">
        <label for="hiphop">Hip Hop</label>

        <input type="radio" name="genre" id="electronic">
        <label for="electronic">Electronic</label>

        <input type="radio" name="genre" id="jazz">
        <label for="jazz">Jazz</label>

        <input type="radio" name="genre" id="classical">
        <label for="classical">Classical</label>

        <input type="radio" name="genre" id="country">
        <label for="country">Country</label>

        <input type="radio" name="genre" id="randb">
        <label for="randb">R&amp;B</label>

        <input type="radio" name="genre" id="genreother">
        <label for="other">Other</label>
      </fieldset>

      <fieldset>
        <legend>
          Select which music services you use (one or more)
        </legend>

        <input type="checkbox" name="spotify" id="spotify">
        <label for="spotify">Spotify</label>

        <input type="checkbox" name="applemusic" id="applemusic">
        <label for="applemusic">Apple Music</label>

        <input type="checkbox" name="amazonmusic" id="amazonmusic">
        <label for="amazonmusic">Amazon Music</label>

        <input type="checkbox" name="youtubemusic" id="youtubemusic">
        <label for="youtubemusic">YouTube Music</label>

        <input type="checkbox" name="siriusxm" id="siriusxm">
        <label for="siriusxm">SiriusXM</label>

        <input type="checkbox" name="tidal" id="tidal">
        <label for="tidal">TIDAL</label>

        <input type="checkbox" name="qobuz" id="qobuz">
        <label for="qobuz">Qobuz</label>

        <input type="checkbox" name="pandora" id="pandora">
        <label for="pandora">Pandora</label>

        <input type="checkbox" name="iheartradio" id="iheartradio">
        <label for="iheartradio">iHeart Radio</label>

        <input type="checkbox" name="deezer" id="deezer">
        <label for="deezer">Deezer</label>

        <input type="checkbox" name="soundcloud" id="soundcloud">
        <label for="soundcloud">SoundCloud</label>

        <input type="checkbox" name="servicesother" id="servicesother">
        <label for="servicesother">Other</label>
      </fieldset>

      <label for="favoritesong">What is your favorite song and what does it mean to you?</label>
      <textarea name="favoritesong" id="favoritesong" cols="60" rows="3"></textarea>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>
    Yehoshua Anton
    Yehoshua_Anton@insideranken.org
  </body>
</html>
