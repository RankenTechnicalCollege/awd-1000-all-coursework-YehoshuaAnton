<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./music-styles.css">
  </head>

  <body>
    <h1>
      Music Survey
    </h1>

    <form action="#" method="get">
      <label for="name">Name:</label>
      <input type="text" name="name" id="name">

      <label for="email">E-mail:</label>
      <input type="email" name="email" id="email">

      <fieldset>
        <legend>
          Select your favorite music genre
        </legend>

        <label>
          <input type="radio" name="genre" id="rock">Rock
        </label>

        <label>
          <input type="radio" name="genre" id="pop">Pop
        </label>

        <label>
          <input type="radio" name="genre" id="hiphop">Hip Hop
        </label>

        <label>
          <input type="radio" name="genre" id="electronic">Electronic
        </label>

        <label>
          <input type="radio" name="genre" id="jazz">Jazz
        </label>

        <label>
          <input type="radio" name="genre" id="classical">Classical
        </label>

        <label>
          <input type="radio" name="genre" id="country">Country
        </label>

        <label>
          <input type="radio" name="genre" id="randb">R&amp;B
        </label>

        <label>
          <input type="radio" name="genre" id="genreother">Other
        </label>
      </fieldset>

      <fieldset>
        <legend>
          Select which music services you use (one or more)
        </legend>

        <label>
          <input type="checkbox" name="spotify" id="spotify">Spotify
        </label>

        <label>
          <input type="checkbox" name="applemusic" id="applemusic">Apple Music
        </label>

        <label>
          <input type="checkbox" name="amazonmusic" id="amazonmusic">Amazon Music
        </label>

        <label>
          <input type="checkbox" name="youtubemusic" id="youtubemusic">YouTube Music
        </label>

        <label>
          <input type="checkbox" name="siriusxm" id="siriusxm">SiriusXM
        </label>

        <label>
          <input type="checkbox" name="tidal" id="tidal">TIDAL
        </label>

        <label>
          <input type="checkbox" name="qobuz" id="qobuz">Qobuz
        </label>

        <label>
          <input type="checkbox" name="pandora" id="pandora">Pandora
        </label>

        <label>
          <input type="checkbox" name="iheartradio" id="iheartradio">iHeart Radio
        </label>

        <label>
          <input type="checkbox" name="deezer" id="deezer">Deezer
        </label>

        <label>
          <input type="checkbox" name="soundcloud" id="soundcloud">SoundCloud
        </label>

        <label>
          <input type="checkbox" name="servicesother" id="servicesother">Other
        </label>
      </fieldset>

      <label for="musicdoes">What does music do for you?</label>
      <select name="musicdoes" id="musicdoes" size="3">
        <option value="relax">Relax</option>
        <option value="motivate">Motivate</option>
        <option value="focus">Focus</option>
        <option value="reflect">Reflect</option>
      </select>

      <label for="favoritesong">What is your favorite song and what does it mean to you?</label>
      <textarea name="favoritesong" id="favoritesong" cols="60" rows="3"></textarea>

      <button type="submit" id="submit" class="button">Submit</button>
      <button type="reset" id="reset" class="button">Reset</button>
    </form>
    Yehoshua Anton
    Yehoshua_Anton@insideranken.org
  </body>
</html>
